name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_notebooks:
        description: 'Execute Jupyter notebooks during build'
        required: false
        default: false
        type: boolean
      publish_artifacts:
        description: 'Publish build artifacts'
        required: false
        default: true
        type: boolean

jobs:
  # Quality checks job
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-quality-

    # The package and its app extras are installed so that black, isort and
    # mypy run at the versions pinned in the dev extra and mypy sees the
    # real third-party types.
    - name: Install quality dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,api,app]" bandit pip-audit

    - name: Check code formatting (Black)
      run: black --check --diff libs/ tools/ application/ scripts/ studies/ tests/

    - name: Check import sorting (isort)
      run: isort --check-only --diff libs/ tools/ application/ scripts/ studies/ tests/

    - name: Lint code (flake8)
      run: flake8 libs/ tools/ application/ scripts/ studies/ tests/ --count --show-source --statistics

    - name: Type checking (mypy)
      run: mypy libs/vedic_astrology_core/ application/

    # Medium and high severity fail the build; low (assert, subprocess with a
    # fixed argument list) is reported by bandit -r locally.
    - name: Security scan (bandit)
      run: bandit -r libs/ tools/ application/ --exclude tests -ll

    # Audits the pinned lockfile (`safety check` now needs an account).
    - name: Check dependencies security (pip-audit)
      run: pip-audit -r ops/requirements.lock.txt --no-deps --disable-pip

  # Test job with matrix
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-test-

    - name: Install system dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libswe-dev || {
          wget -q http://www.astro.com/ftp/swisseph/swe_unix_src_2.10.03.tar.gz
          tar -xzf swe_unix_src_2.10.03.tar.gz
          cd swe_unix_src_2.10.03/src && make libswe.a && sudo make install
        }

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,stats,data,api,app]"

    # No PYTHONPATH: the package is installed and tests/conftest.py adds the
    # repository root. The Quarto render smoke needs Quarto and TeX, which the
    # Build & Deploy workflow has; it is deselected here.
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=vedic_astrology_core --cov-report=xml --cov-report=term-missing -k "not quarto_render_smoke" --junitxml=pytest-report.xml

    # Job logs need a login; annotations are public. Up to ten failures and
    # collection errors are surfaced as annotations on the run.
    - name: Report test failures as annotations
      if: failure()
      run: |
        python - <<'PY'
        import pathlib
        import xml.etree.ElementTree as ET

        report = pathlib.Path("pytest-report.xml")
        if not report.exists():
            print("::error title=pytest::no pytest-report.xml was written")
            raise SystemExit
        shown = 0
        for case in ET.parse(report).iter("testcase"):
            for kind in ("failure", "error"):
                node = case.find(kind)
                if node is None or shown >= 10:
                    continue
                text = (node.get("message") or node.text or "").strip()
                text = " ".join(text.split())[:400]
                title = f"{case.get('classname')}.{case.get('name')}"
                print(f"::error title={title}::{kind}: {text}")
                shown += 1
        PY

    # Offline against tests/fixtures/horizons/ (HORIZONS_LIVE=1 refetches).
    - name: Ephemeris cross-check against JPL Horizons
      run: |
        python -m pytest tests/test_horizons_crosscheck.py -v --no-cov

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Documentation Job (Merged from docs.yml)
  docs:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser sphinx-autoapi sphinx-copybutton
        pip install -e .

    - name: Build documentation
      run: |
        mkdir -p docs/api
        sphinx-build -b html docs/ docs/_build/html
        # Copy pre-generated PDFs to root of the site and research folder
        cp pdfs/*.pdf docs/_build/html/ || true
        mkdir -p docs/_build/html/research
        cp pdfs/*.pdf docs/_build/html/research/ || true

    # GitHub Pages serves the Quarto site from build-deploy.yml; this job
    # only checks that the Sphinx API docs build and keeps them as an artifact.
    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: sphinx-docs
        path: docs/_build/html/

  # Release Job (Merged from auto-release.yml)
  release:
    runs-on: ubuntu-latest
    needs: [test, docs]
    # Only on a version tag (v*): a push to main must not publish a release.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      if: github.repository_owner == 'astro-fusion'
      run: |
        if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
        else
          echo "PYPI_API_TOKEN secret not configured, skipping PyPI upload"
        fi

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          Automated release of Vedic Numerology-Astrology Integration System.

          ## Artifacts
          - Python Package (PyPI)
          - Documentation (GitHub Pages)
        draft: false
        prerelease: false
