name: Build & Deploy Research Platform

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'studies/**'
      - 'site/**'
      - 'tests/site/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'papers/**'
      - '_quarto.yml'
      - 'scripts/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - '.github/workflows/build-deploy.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Step 1: Test with Sample Data
  test-sample-data:
    runs-on: ubuntu-latest
    name: Test with Sample Earthquake Data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,stats]"

      - name: Test earthquake analysis with sample data
        run: |
          echo "🔬 Testing earthquake-planetary correlation analysis..."
          python studies/earthquake/scripts/earthquake_planetary_analysis.py
          echo "✅ Sample data test completed!"

          # Check if results were generated
          if [ -f "studies/earthquake/data/earthquake_planetary_correlation_analysis.json" ]; then
            echo "✅ Analysis results generated successfully"
            echo "📊 Result file size: $(du -h studies/earthquake/data/earthquake_planetary_correlation_analysis.json | cut -f1)"
          else
            echo "⚠️ Analysis results not found"
          fi

  # Step 2: Build Documentation Site
  build:
    needs: test-sample-data
    runs-on: ubuntu-latest
    name: Build Documentation Site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,stats]"

      - name: Build documentation structure
        run: |
          echo "📖 Building documentation site..."

          # Render Quarto Project
          echo "🏗️ Rendering Quarto project..."
          quarto render

          # Create site structure

          mkdir -p _site/{docs,reports,visualizations,data,downloads}

          # Copy documentation
          echo "📋 Copying documentation..."
          cp -r docs/* _site/docs/ 2>/dev/null || true

          # Copy reports
          echo "📄 Copying reports..."
          find . -name "*.pdf" -type f ! -path "./.git/*" -exec cp {} _site/reports/ \; 2>/dev/null || true

          # Copy visualizations
          echo "📊 Copying visualizations..."
          find . -name "*.html" -type f ! -path "./.git/*" ! -path "./_site/*" -exec cp {} _site/visualizations/ \; 2>/dev/null || true

          # Copy analysis results
          echo "📈 Copying analysis results..."
          find studies -name "*.json" -type f ! -path "*/node_modules/*" -exec cp {} _site/data/ \; 2>/dev/null || true

          echo "✅ Documentation structure built"

      # Smoke test of the rendered site (tests/site/smoke.spec.ts): serves
      # _site/ statically, opens every explorer and asserts each chart
      # renders with its default filters and no console errors.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Site smoke test
        run: npx playwright test --config playwright.config.ts

      # The home page is site/index.qmd: Quarto writes _site/index.html as a
      # redirect to it. No step may write its own _site/index.html, and no
      # Jekyll pass may rebuild _site over the Quarto output.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Step 3: Deploy to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "✅ Deployment to GitHub Pages completed!"
          echo "📱 Your site is available at: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📖 Documentation:"
          echo "  - Architecture: ${{ steps.deployment.outputs.page_url }}docs/architecture/"
          echo "  - Guides: ${{ steps.deployment.outputs.page_url }}docs/guides/"
          echo "  - Reports: ${{ steps.deployment.outputs.page_url }}reports/"
          echo "  - Visualizations: ${{ steps.deployment.outputs.page_url }}visualizations/"
