# Quarto website for the research project (ADR-001).
# Site pages live in site/, study papers in studies/<name>/paper/, cross-study
# papers in papers/. templates/, tests/, docs/, notebooks/ and paper drafts are
# not rendered.

project:
  type: website
  output-dir: _site
  resources:
    - site/data/**
    - site/components/**
  render:
    - site/*.qmd
    - site/explore/*.qmd
    - studies/*/paper/*.qmd
    - studies/*/paper/*.md
    - papers/*.qmd
    - papers/*.md
    - papers/astrology/*.md
    - "!templates/"
    - "!tests/"
    - "!docs/"
    - "!notebooks/"
    - "!studies/*/paper/drafts/"
    - "!studies/*/paper/sections/"

website:
  title: "Astro Research"
  site-url: https://astro-fusion.github.io/astro_research-white-paper/
  repo-url: https://github.com/astro-fusion/astro_research-white-paper
