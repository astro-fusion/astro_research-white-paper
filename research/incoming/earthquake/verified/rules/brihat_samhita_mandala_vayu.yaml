# yaml-language-server: $schema=../../../../rules/schema.json
id: seismic.brihat_samhita_mandala_vayu
name: Brihat-Samhita-Vayu-Mandala
domain: seismic
claim: >-
  An earthquake occurring while the Moon transits the Vayu (Wind) mandala nakshatras
  (Uttara Phalguni, Hasta, Chitra, Swati, Punarvasu, Mrigashira, Ashwini)
  produces tremors extending 200 yojanas, preceded 7 days by dust storms and dimmed solar rays.
source:
  text: Brihat Samhita
  edition: N. Chidambaram Iyer (1884, reprinted 1987) / M. Ramakrishna Bhat (Motilal Banarsidass 1981, Part II)
  chapter: '32'
  verse: 8-11, 28, 31
  url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc229177.html
  published: '0550-01-01'
verified: true
edition: M. Ramakrishna Bhat (Motilal Banarsidass 1981, Part II, pp. 287-296); N. Chidambaram Iyer (1884)
page: Part II, pp. 287-291; Chapter 32 verses 8-11, 31
evidence_url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc229177.html
textual_hermeneutic_finding: >-
  In classical Jyotish (Brihat Samhita 32.7, 32.23, 32.27, 32.31), the mandala of the Moon's nakshatra
  is evaluated at the moment an earthquake occurs to determine its geographic radius (200 yojanas for Vayu)
  and predict its socioeconomic aftermath over the subsequent 6 months. It was not intended as a forward
  causal trigger for earthquake nucleation.
tier: classical
params:
  window_days: {value: 7, min: 1, max: 14, step: 1, unit: days}
conditions:
  moon_mandala:
    mandalas:
      - vayu
chart: transit-only
window:
  unit: days
  before: 7
  after: 7
region: Saurashtra, Kuru, Magadha, Dasharna, Matsya (Northwestern and Central India)
expected_effect:
  series: quake_rate
  direction: two-sided
  magnitude: '>= 4.0'
reference_cases:
  - moment: '2015-04-25T06:11:26Z'
    expect: fires
    note: >-
      2015 Mw 7.8 Gorkha earthquake: Moon was in Punarvasu nakshatra (Vayu mandala, BS 32.8).
    verified_with: astro-research engine 2026-11-08 (Lahiri, mean node)
  - moment: '2015-05-12T07:05:19Z'
    expect: silent
    note: >-
      2015 Mw 7.3 Kodari aftershock: Moon was in Shatabhisha (Varuna mandala), not Vayu.
    verified_with: astro-research engine 2026-11-08 (Lahiri, mean node)
ex_ante: false
computable: true
