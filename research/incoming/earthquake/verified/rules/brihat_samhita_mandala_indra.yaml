# yaml-language-server: $schema=../../../../rules/schema.json
id: seismic.brihat_samhita_mandala_indra
name: Brihat-Samhita-Indra-Mandala
domain: seismic
claim: >-
  An earthquake occurring while the Moon transits the Indra (Surapati) mandala nakshatras
  (Abhijit, Shravana, Dhanishtha, Rohini, Jyeshtha, Uttara Ashadha, Anuradha)
  produces tremors extending 160 yojanas, preceded 7 days by dark rain clouds and lightning.
source:
  text: Brihat Samhita
  edition: N. Chidambaram Iyer (1884, reprinted 1987) / M. Ramakrishna Bhat (Motilal Banarsidass 1981, Part II)
  chapter: '32'
  verse: 16-19, 28, 31
  url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc229177.html
  published: '0550-01-01'
verified: true
edition: M. Ramakrishna Bhat (Motilal Banarsidass 1981, Part II, pp. 287-296); N. Chidambaram Iyer (1884)
page: Part II, pp. 293-294; Chapter 32 verses 16-19, 31
evidence_url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc229177.html
textual_hermeneutic_finding: >-
  In classical Jyotish (Brihat Samhita 32.7, 32.23, 32.27, 32.31), the mandala of the Moon's nakshatra
  is evaluated at the moment an earthquake occurs to determine its geographic radius (160 yojanas for Indra)
  and predict its socioeconomic aftermath over the subsequent 6 months. It was not intended as a forward
  causal trigger for earthquake nucleation.
tier: classical
params:
  window_days: {value: 7, min: 1, max: 14, step: 1, unit: days}
conditions:
  moon_mandala:
    mandalas:
      - indra
chart: transit-only
window:
  unit: days
  before: 7
  after: 7
region: Kasi, Yugandhara, Chedi, Kuru, Magadha (Gangetic plains and Central India)
expected_effect:
  series: quake_rate
  direction: two-sided
  magnitude: '>= 4.0'
reference_cases:
  - moment: '1934-01-15T08:43:00Z'
    expect: fires
    note: >-
      1934 Mw 8.1 Bihar-Nepal earthquake: Moon was in Shravana nakshatra (Indra mandala, BS 32.16).
    verified_with: astro-research engine 2026-11-08 (Lahiri, mean node)
  - moment: '2015-04-25T06:11:26Z'
    expect: silent
    note: >-
      2015 Mw 7.8 Gorkha earthquake: Moon was in Punarvasu (Vayu mandala), not Indra.
    verified_with: astro-research engine 2026-11-08 (Lahiri, mean node)
ex_ante: false
computable: true
