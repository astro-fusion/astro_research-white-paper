id: mundane.classical.meghamala_garga_cloud_wind_monsoon
name: "Meghamala: Ashadha Shukla Panchami Cloud Formation and Flood Trigger"
domain: mundane
claim: >-
  On Ashadha Shukla Panchami (5th tithi of the bright half of Ashadha), observe cloud structures
  and prevailing wind at sunrise and sunset. If the eastern wind blows and clouds form dense,
  dark, elephant- or mountain-shaped arrays (meghamala) with continuous distant thunder,
  copious monsoon rain and extensive riverine floods will inundate northern and eastern India.
  If south-westerly dry winds prevail, seasonal rain fails.
source:
  text: Meghamala
  edition: "Meghamala: An Ancient Sanskrit Treatise on Meteorology and Cloud Divination (Venkateshwara Steam Press, Bombay / Chaukhamba Sanskrit Pratishthan)"
  chapter: "Ashadha-Panchami-Lakshana"
  verse: "1-18"
  url: https://archive.org/details/meghamala_sanskrit
  published: "c. 800 CE"
tier: classical
