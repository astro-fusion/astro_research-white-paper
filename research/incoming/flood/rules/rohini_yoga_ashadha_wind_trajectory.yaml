id: mundane.classical.rohini_yoga_ashadha_wind_trajectory
name: "Rohini Yoga: Ashadha Lunar Conjunction and Wind Trajectory"
domain: mundane
claim: >-
  During Ashadha Krishna Paksha, when the Moon transits Rohini (sidereal Taurus 10°00'-23°20'),
  the direction of the prevailing wind and the celestial latitude of the Moon determine the monsoon.
  Wind from the East or North-East with northern lunar passage brings widespread rainfall and high harvest yield;
  wind from the South or South-West with southern lunar passage portends deficient monsoon and agricultural crisis.
source:
  text: Brihat Samhita
  edition: "Varahamihira's Brihat Samhita with English Translation by M. Ramakrishna Bhat (Motilal Banarsidass, Delhi, 1981)"
  chapter: "24"
  verse: "1-15"
  url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc362880.html
  published: "c. 550 CE"
tier: classical
params:
  transit_orb_hours:
    value: 24
    min: 12
    max: 48
    step: 6
    unit: hours
conditions:
  all:
    - month_paksha:
        months:
          - Ashadha
        paksha: krishna
    - in_nakshatra:
        planet: Moon
        nakshatras:
