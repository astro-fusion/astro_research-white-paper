id: mundane.classical.swati_yoga_ashadha_rain_indicator
name: "Swati Yoga: Rain Occurrence on Moon-Swati Conjunction in Ashadha"
domain: mundane
claim: >-
  During the month of Ashadha, if rain falls when the Moon conjoins the asterism Swati,
  abundant rain will fall during the entire monsoon season; if there is heavy wind without rain,
  scarcity and poor agricultural yield follow.
source:
  text: Brihat Samhita
  edition: "Varahamihira's Brihat Samhita with English Translation by M. Ramakrishna Bhat (Motilal Banarsidass, Delhi, Part 1, 1981, ISBN: 978-81-208-1060-0)"
  chapter: "25"
  verse: "1-7"
  page: "pp. 255-257"
  url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc228926.html
  published: "c. 550 CE"
tier: classical
