computable_explanation: >-
  NON-COMPUTABLE FROM EPHEMERIS ALONE: The Moon-Rohini transit window in Ashadha Krishna Paksha is
  100% computable from Swiss Ephemeris. However, the rule explicitly requires real-time anemometer
  or wind-vane observations of 8 cardinal wind directions across the four watches (yamas) of the 24-hour period.
