id: mundane.classical.rohini_yoga_ashadha_wind_trajectory
name: "Rohini Yoga: Moon-Rohini Conjunction Wind Vectors in Ashadha"
domain: mundane
claim: >-
  When the Moon conjoins the Rohini asterism in the dark half of Ashadha (Ashadha Krishna Rohini),
  the wind direction observed across the four watches of the day forecasts seasonal rainfall:
  winds from the East and Northeast bring abundant rainfall and prosperity, while South and
  Southwest winds bring acute drought and famine.
source:
  text: Brihat Samhita
  edition: "Varahamihira's Brihat Samhita with English Translation by M. Ramakrishna Bhat (Motilal Banarsidass, Delhi, Part 1, 1981, ISBN: 978-81-208-1060-0)"
  chapter: "24"
  verse: "1-15"
  page: "pp. 238-245"
