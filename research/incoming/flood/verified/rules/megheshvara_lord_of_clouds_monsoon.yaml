id: mundane.classical.megheshvara_lord_of_clouds_monsoon
name: "Megheshvara: Lord of Clouds in the Navanayaka Governance Scheme"
domain: mundane
claim: >-
  The planet governing clouds (Megheshvara) determines seasonal monsoon abundance.
  Two classical traditions exist:
    - Variant A (Ardra Ingress): The weekday of the exact moment the Sun enters Ardra nakshatra (Gemini 06°40'00").
    - Variant B (Karka Sankranti): The weekday of the exact moment the Sun enters Cancer (Karka Sankranti 00°00'00").
  Benefic lords (Moon, Mercury, Jupiter, Venus) produce abundant rainfall, thriving agriculture, and flood episodes.
  Malefic lords (Sun, Mars, Saturn) produce deficient rainfall, scorching heat, and localized droughts.
source:
  text: Panchanga Navanayaka System (Muhurta Chintamani / Babu Madhavrao Joshi Panchang)
  edition: "Muhurta Chintamani of Ramadaivajna, with 'Piyushadhara' commentary (Chowkhamba Sanskrit Series Office, Varanasi, 1976)"
  chapter: "Navanayaka-Phala Section"
