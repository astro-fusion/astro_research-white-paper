id: mundane.classical.ardra_pravesha_solar_ingress_monsoon
name: "Ardra Pravesha: Solar Ingress Chart for Southwest Monsoon Forecasting"
domain: mundane
claim: >-
  The exact moment the Sun enters the sidereal asterism Ardra (Gemini 06°40'00" Lahiri) sets the
  horoscopic foundation for the southwest monsoon season. If the Lagna and Moon fall in watery signs
  (Cancer, Scorpio, Pisces) aspected by benefics (Jupiter, Venus, Mercury), abundant and well-distributed
  rainfall occurs. If malefics (Saturn, Mars, Rahu) afflict the luminaries or occupy Kendra houses in fiery signs,
  the monsoon is delayed, deficient, or erratic.
source:
  text: Bhavishya Phala Bhaskara / Brihat Samhita ch. 23
  edition: "Bhavishya Phala Bhaskara (Khemraj Shrikrishnadas, Bombay, 1913) & Brihat Samhita Part 1 (Motilal Banarsidass, Delhi, 1981)"
  chapter: "Ardra-Pravesha Section"
  verse: "15-28"
