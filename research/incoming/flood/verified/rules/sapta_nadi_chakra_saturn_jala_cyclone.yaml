id: mundane.classical.sapta_nadi_chakra_saturn_jala_cyclone
name: "Sapta Nadi Chakra: Saturn in Watery Nadi (Jala/Amrita) Cyclonic Deluge"
domain: mundane
claim: >-
  In the 28-asterism Sapta Nadi Chakra of Narapatijayacharya Svarodaya, when Saturn, Mars, or Rahu
  transits through the Jala Nadi (Pushya, Purvaphalguni, Abhijit, Shatabhisha) or Amrita Nadi
  (Ashlesha, Magha, Shravana, Dhanishta) during monsoon or cyclone seasons, severe oceanic depressions,
  destructive cyclones, and torrential inland deluges occur.
source:
  text: Narapatijayacharya Svarodaya
  edition: "Narapatijayacharya Svarodaya with 'Jayalaksmi' Sanskrit Commentary of Harivamsa Pathaka, edited by Ganesa Datta Pathaka (Chowkhamba Sanskrit Series Office, Varanasi, 1971 / 1982)"
  chapter: "Sapta Nadi Chakra Prakaranam"
  verse: "1-12"
