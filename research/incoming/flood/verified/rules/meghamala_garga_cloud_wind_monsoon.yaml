id: mundane.classical.meghamala_garga_cloud_wind_monsoon
name: "Meghamala: Garga Ashadha Shukla Panchami Cloud and Wind Observations"
domain: mundane
claim: >-
  Observations of wind direction and cloud formations at dawn, noon, and twilight on the fifth lunar day
  of the bright fortnight of Ashadha (Ashadha Shukla Panchami) predict the entire four-month monsoon rainfall:
  winds from the East or North produce continuous heavy rains and brimming reservoirs; winds from the
  South or Southwest produce scorching droughts and famine.
source:
  text: Meghamala (attributed to Rishi Garga)
  edition: "Meghamala with Hindi Commentary, edited by Pt. Ramaswarup Sharma (Khemraj Shrikrishnadas, Bombay, 1911 / reprinted Chaukhambha, Varanasi, 1985)"
  chapter: "Ashadha-Panchami-Lakshana"
  verse: "1-18"
  page: "pp. 24-32"
  url: https://archive.org/details/meghamala_sanskrit/
  published: "Classical Sanskrit Weather Shastra"
tier: classical
