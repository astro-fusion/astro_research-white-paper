id: mundane.classical.varsheshvara_samvatsara_king_monsoon
name: "Varsheshvara: Samvatsara King Planet Annual Agricultural and Rainfall Index"
domain: mundane
claim: >-
  The King of the Year (Varsheshvara / Raja), determined by the planetary weekday of sunrise at
  the start of Chaitra Shukla Pratipada (the Hindu New Year), governs the annual rainfall and crops.
  Benefic kings (Moon, Mercury, Jupiter, Venus) ensure copious rainfall, high agricultural yields, and full reservoirs;
  malefic kings (Sun, Mars, Saturn) bring heatwaves, pestilence, erratic monsoons, and droughts.
source:
  text: Brihat Samhita
  edition: "Varahamihira's Brihat Samhita with English Translation by M. Ramakrishna Bhat (Motilal Banarsidass, Delhi, Part 1, 1981, ISBN: 978-81-208-1060-0)"
  chapter: "19"
  verse: "1-9"
  page: "pp. 200-205"
  url: https://www.wisdomlib.org/hinduism/book/brihat-samhita/d/doc228920.html
  published: "c. 550 CE"
tier: classical
params:
  calculation: "Weekday at sunrise following the exact Sun-Moon conjunction in Pisces (Chaitra Shukla Pratipada)"
  planetary_outcomes:
    Moon: copious_rain_abundant_food
    Jupiter: abundant_rain_peace_virtue
    Venus: heavy_timely_rains_bumper_crops
    Mercury: plentiful_rains_thriving_trade
    Sun: scanty_rain_fires_strife
    Mars: severe_scarcity_fire_famine
    Saturn: storms_drought_pestilence
