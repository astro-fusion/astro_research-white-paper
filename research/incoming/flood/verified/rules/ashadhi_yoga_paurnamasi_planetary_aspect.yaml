id: mundane.classical.ashadhi_yoga_paurnamasi_planetary_aspect
name: "Ashadhi Yoga: Planetary Dispositions and Wind at Ashadha Full Moon"
domain: mundane
claim: >-
  On the Full Moon day of Ashadha (Ashadha Paurnamasi), the disposition of planets and the wind
  direction at sunrise and sunset forecast monsoon success. Benefics (Jupiter, Venus, Mercury)
  aspecting the Moon indicate bountiful rain and bumper crops; malefics aspecting indicate famine.
