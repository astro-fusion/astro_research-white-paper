    expect: silent
    note: Mars in Scorpio 2°, Uranus in Taurus 22° (aspect separation 20°, outside 4° orb).
    url: https://www.forbes.com/
ex_ante: true
computable: true
notes:
  practitioner_quote: "Mars-Uranus hard aspects are the most explosive configurations in the heavens. They trigger accidents, violent geopolitical events, and sudden sharp turns in precious metals."
