  edition: Arch Crawford (Interview with Timer Digest, 2006/2011)
  chapter: Newsletter archives
  verse: Gold timing rules
  url: https://www.forbes.com/2006/03/24/astrology-crawford-investing-cx_pm_0324crawford.html
  published: '2006-03-24'
