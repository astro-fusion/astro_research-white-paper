# SESOI source table (ADR-008 section 7.2, finding S-13).
#
# A smallest effect size of interest (SESOI) in a domain plan may come only from
#   (1) the rule's own source, quoted with page (kind: source, in the plan), or
#   (2) a yardstick listed here: the published size of the best-established
#       non-astrological effect of the same kind on the same outcome.
# Neither: the test has no SESOI, verdict E is impossible, and the card shows
# X95 and X-strict only.
#
# "entries" starts EMPTY on purpose. Design task D11 fills it from the
# publications; the owner checks every number at the page (H18). No value is
# chosen by this project, and no entry may cite a file inside this repository
# (results, ledgers, ADRs, site data).
#
# "candidates" lists publications that MIGHT qualify (docs/research/SESOI_PROPOSAL.md),
# each with status "proposed, awaiting H18". A candidate carries no number, is
# reported by validity/plan.py sesoi_report() as not usable for E, and a plan
# that names one as its yardstick_id is refused. When the owner has read the
# page, the entry is written into "entries" (all fields below) and the candidate
# is deleted. Order of choice: ADR-008 A3.4 item 2 (same market/arc/region, then
# overlapping sample period, then earliest). No candidate exists for gold
# extreme moves, peninsular drought, or "strong" earthquake triggering (no
# published yardstick known): those outcomes keep sesoi: null.
#
# Entry fields (all required, validated by core/validity/plan.py):
#   id:                 unique key that a plan's sesoi.yardstick_id refers to
#   kind:               one of daily_returns, monthly_returns, earthquake_rate,
#                       monsoon_rainfall, flood_rate
#   citation:           full external publication (authors, year, title, venue, DOI or URL)
#   page:               page, table or figure of the number
#   number_as_printed:  the number exactly as printed, with its unit
#   conversion:         how it becomes the plan's effect scale
#   converted_value:    the number on the plan's effect scale
#   checker:            name of the person who checked it at the page
#   date:               ISO date of the check
schema_version: 1
entries: []
candidates:
  - id: M-1
    outcomes: [all_india_jjas_anomaly_pct]
    kind: monsoon_rainfall
    status: "proposed, awaiting H18"
    recommended: true
    read_at_page: "mean June-September anomaly (percent of LPA) of El Nino years; must be a printed composite mean, else it does not qualify"
    citation: "Kumar, Rajagopalan, Hoerling, Bates and Cane (2006), Unraveling the mystery of Indian monsoon failure during El Nino, Science 314, 115-119 [index]. Also: Rasmusson and Carpenter (1983), Monthly Weather Review 111, 517-528 [memory]; Kumar, Rajagopalan and Cane (1999), Science 284, 2156-2159 [memory]"
  - id: M-2
    outcomes: [all_india_jjas_anomaly_pct]
    kind: monsoon_rainfall
    status: "proposed, awaiting H18"
    recommended: false
    read_at_page: "the IMD boundary of the deficient class (seasonal rain below 90 percent of LPA); a category boundary, usable only under A3.4 item 4 (the rule's own source must say deficient or drought)"
    citation: "India Meteorological Department monsoon FAQ (imdpune.gov.in/faq_monsoon.php); Parthasarathy, Munot and Kothawale (1994), All-India monthly and seasonal rainfall series 1871-1993, Theoretical and Applied Climatology 49, 217-224, doi:10.1007/BF00867461 [index]"
  - id: M-3
