    kind: monsoon_rainfall
    status: "proposed, awaiting H18"
    recommended: false
    read_at_page: "El Nino composite for the peninsular series; none found yet, a regional yardstick may not exist in print (then sesoi: null)"
    citation: "IITM homogeneous-region rainfall series documentation (Parthasarathy and co-authors; report number to confirm) [memory]"
  - id: M-4
