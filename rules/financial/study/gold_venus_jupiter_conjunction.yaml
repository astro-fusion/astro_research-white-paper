# Venus-Jupiter conjunction (Shukra-Guru-Wealth): gold study indicator as a rule file.
id: financial.study.gold_venus_jupiter_conjunction
version: 1
name: Gold Venus-Jupiter conjunction (Shukra-Guru-Wealth)
domain: financial
claim: Venus-Jupiter conjunction (Shukra-Guru-Wealth) changes the gold return, its absolute size or the
  chance of an extreme move on the next bar.
source:
  text: Study plan studies/gold_market/hypothesis.yaml
  note: The fixed indicator family of the pre-registered plan (2026-11-08). No classical text or chapter
    is cited for the market claim.
author: astro-research study plan (ported 2026-11-22)
tier: experimental
conditions:
  use: financial.shukra_guru_wealth@2
expected_effect:
  series: gold_usd
  direction: either
  fixed_by: project
  description: The plan tests a difference in either direction.
reference_cases:
- moment: '1999-03-03T06:00:00Z'
  expect: fires
  note: Venus-Jupiter conjunction (Shukra-Guru-Wealth) holds at this moment (06:00 UTC, 4-day scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
- moment: '2001-10-06T06:00:00Z'
  expect: silent
  note: Venus-Jupiter conjunction (Shukra-Guru-Wealth) does not hold at this moment (06:00 UTC, 4-day
    scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
reading:
  kind: forward_trigger
  note: The state on bar t-1 is set against the outcome on bar t.
operationalisation:
- choice: day_convention
  value: sample instant of the previous trading bar (market fixing time, in UTC)
  fixed_by: project
  alternatives:
  - noon UTC
  - sunrise at the exchange city
  note: The plan tests the state on bar t-1 against the outcome on bar t.
- choice: place
  value: 'none: geocentric sidereal positions'
  fixed_by: project
  alternatives:
  - Delhi
  - New York
- choice: horizon
  value: the next bar of the outcome series
  fixed_by: project
  alternatives:
  - 5 bars
  - 21 bars
- choice: ayanamsa
  value: Lahiri
  fixed_by: project
  alternatives:
  - Raman
  - Krishnamurti
tests:
- domain: gold
  outcome: log_return
  direction: either
  project_extension: true
- domain: gold
  outcome: abs_return
  direction: either
  project_extension: true
- domain: gold
  outcome: extreme_move
  direction: either
  project_extension: true
notes:
  ported_from: Moved unchanged from studies/gold_market/hypothesis.yaml (ADR-007 WP-71); the plan's indicator
    id is venus_jupiter_conjunction.
  plan_indicator: venus_jupiter_conjunction
