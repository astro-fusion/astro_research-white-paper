id: "dasha.vimshottari"
name:
  sanskrit: "Vimshottari"
  english: "Vimshottari dasha, three levels"
family: "dasha"
tradition: "jataka_applied"
tier: "core"
source:
  text: "Brihat Parashara Hora Shastra"
  edition: "R. Santhanam tr., Ranjan Publications, 1984, vol. 2, p. 507-508 (owner's scan 'BPHS - 2 RSanthanam.pdf', PDF p. 17-18)"
  translator: "R. Santhanam"
  chapter: "46"
  verse: "12-16"
  quote: "Beginning from Krittika the lords of Dasas (periods) are the Sun, the Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu and Venus in that order."
  url: null
  archive_url: null
  checked_by: null
  checked_at: null
definition:
  inputs: ["moon_sidereal_longitude","birth_moment"]
  formula: "The Moon's nakshatra gives the first mahadasha lord; the fraction already traversed fixes a virtual start before birth. Child period length = parent length x child lord years / 120, children start with the parent's lord. Dasha year is the Julian year (365.25 d) by default; 360-day year is a named variant."
  conventions: {zodiac: sidereal, ayanamsa: lahiri, node: mean, houses: whole_sign}
  variants: []
implementation:
  module: "vedic_astrology_core.dasha.vimshottari"
  function: "get_vimshottari_chain_at"
predicates: ["dasha_lord_is","antardasha_lord_is"]
needs:
  founding_time_precision_minutes: 5
  place: false
change_period: "about 0.25 days of boundary shift per minute of time error per year of the first lord; Moon nakshatra 24 h"
reference_cases: []
scope: ["case_file","aggregate"]
notes: "Chapter number as cited in dasha/vimshottari.py (m). Golden tests exist (tests/test_golden_dasha.py). A date-only chart supports no dasha level."
