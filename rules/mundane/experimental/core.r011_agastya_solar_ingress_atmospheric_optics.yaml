# yaml-language-server: $schema=../../schema.json
id: mundane.core.r011_agastya_solar_ingress_atmospheric_optics
version: 3
name: Agastya Solar Ingress & Atmospheric Optics
domain: mundane
claim: >-
  Agastya (Canopus) rises with the Sun in Hasta: check that the sidereal Sun is in Hasta
  (160.0 to 173.333 deg), Brihat Samhita 12.22. Version 3; versions 1-2 tested Sun 143 +/- 1.5 deg
  (Simha 23 deg), which the text does not state.
source:
  text: Brihat Samhita
  chapter: '12'
  verse: '22'
  quote: "It is said that Canopus rises when the Sun is stationed in the asterism Hasta and sets when the Sun goes to Rohini."
  edition: "M. Ramakrishna Bhat tr., Motilal Banarsidass, 1981, Part 1, p. 160 (machine-located, awaiting owner check)"
  app_registry: docs/mundane/rule-registry.yaml
  id: RULE-011
  note: >-
    Round 5 check: Agastya-chara is BS ch. 12; v. 22 puts the rising with the Sun in Hasta, not at
    Simha 23 deg (CORRECTIONS.md 2026-11-23). Version 3 implements the text's condition. Chapter
    below refers to the mundane text synthesis behind the AstroFusion registry (attributed
    to B.V. Raman and M.C. Jain plus classical authors); the book edition is not identified,
    see the export PROVENANCE.
author: AstroFusion mundane rule registry (open export 2026-11-08)
tier: experimental
window:
  unit: days
  before: $window_before
  after: $window_after
  note: ingress_window_15_days
status: active
params:
  window_before: {value: 15, min: 0, max: 30, step: 1, unit: days}
  window_after: {value: 15, min: 0, max: 30, step: 1, unit: days}
conditions:
  longitude_between:
    planet: Sun
    start: 160.0
    end: 173.3333
    note: Hasta, sidereal 160 to 173.333 deg (BS 12.22)
reference_cases:
  - moment: '1950-10-06T06:00:00Z'
    expect: fires
    note: Sun is in Virgo 19.2 deg (169.24 deg), in Hasta (160-173.333 deg)
    verified_with: astro-research engine 2026-11-23 (Lahiri, mean node); not yet checked in
      JHora
  - moment: '1950-09-09T06:00:00Z'
    expect: silent
    note: Sun is in Leo 22.8 deg (142.82 deg), before Hasta; this moment fired in versions 1-2
  - moment: '1950-05-06T06:00:00Z'
    expect: silent
    note: Sun is in Aries 22.0 deg (21.98 deg), outside 160-173.333 deg
    verified_with: astro-research engine 2026-11-08 (Lahiri, mean node); not yet checked in
      JHora
validation:
  status: unvalidated
notes:
  version_history:
    - version: 1-2
      condition: Sun sidereal longitude 143 +/- 1.5 deg (141.5-144.5), window 15 days either side
      status: unvalidated, no study results existed when replaced (2026-11-23); kept here for the record
    - version: 3
      condition: Sun in Hasta, 160 to 173.333 deg (BS 12.22); window parameters unchanged
      reason: round 5 text check, CORRECTIONS.md 2026-11-23
  original_condition:
    - Check if Sun longitude is within 143.0 +/- 1.5 deg (Simha 23 deg).
    - 'If ray color is Reddish: Flag Famine and War.'
    - 'If ray color is White/Milky: Flag Peace and Prosperity.'
  original_thresholds:
    agastya_ingress_target_deg: 143
    ingress_orb_deg: 1.5
  mapping_status: mapped
  draft_conditions:
    all:
      - ingress:
          body: Sun
          sidereal_longitude: 143
          orb: 1.5
  event_types:
    - weather
  confidence_in_app: traditional_only
  severity_in_app: elevated
  validation:
    verdict: SPLIT
    problem: >-
      Ingress longitude ($143^\circ$) does not account for local observer horizon/twilight
    normalization: >-
      Split into traditional sidereal calendar marker ($143^\circ$) and real-sky astronomical
      visibility engine based on observer latitude.
    kind: architectural_review_verdict
    source_file: docs/mundane/validation-report.md
    empirical_backtest_result: null
  conversion: >-
    Sun at sidereal 143 deg within 1.5 deg. Converted by hand from draft_conditions to the
    astro-rules vocabulary.
