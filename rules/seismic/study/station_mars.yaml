# yaml-language-server: $schema=../../schema.json
# Mars station within 3 days: earthquake study indicator as a rule file.
id: seismic.study.station_mars
version: 1
name: Earthquake Mars station within 3 days
domain: seismic
claim: 'Mars station within 3 days: the rate of declustered Himalayan-arc earthquakes differs from the
  rate outside it.'
source:
  text: Study plan studies/earthquake/hypothesis.yaml
  published: '2026-11-08'  # the study plan's registered date (its 'registered' field)
  note: The fixed indicator family of the pre-registered plan (2026-11-08). No classical text or chapter
    is cited.
author: astro-research study plan (ported 2026-11-22)
tier: experimental
status: needs_predicates
conditions: null
expected_effect:
  event: earthquake
  direction: increase
  fixed_by: project
reading:
  kind: concurrent
  note: The state at a grid step is set against the events in that step.
operationalisation:
- choice: day_convention
  value: hourly UTC grid step containing the event, no day boundary
  fixed_by: project
  alternatives:
  - daily at 12:00 UTC
  - sunrise day at the arc centre
- choice: place
  value: 'none: geocentric sidereal positions'
  fixed_by: project
  alternatives:
  - arc centre 28 N 85 E
- choice: horizon
  value: the same grid step as the event
  fixed_by: project
  alternatives:
  - 24 hours
- choice: ayanamsa
  value: Lahiri
  fixed_by: project
  alternatives:
  - Raman
  - Krishnamurti
tests:
- domain: earthquake
  outcome: mainshock_rate
  direction: increase
  project_extension: true
notes:
  ported_from: Moved unchanged from studies/earthquake/hypothesis.yaml (ADR-007 WP-71); the plan's indicator
    id is station_mars.
  plan_indicator: station_mars
  needs_predicates: No predicate expresses a window around a planetary station (the sign change of its
    speed). The old study computes it in studies/earthquake/scripts/indicators.py (sign_change_bins, window_mask,
    3 days either side).
  missing_predicates:
  - station_within_days(planet, days)
  original_condition:
  - within 3 days either side of a Mars station (daily speed changes sign)
validation:
  status: unvalidated
