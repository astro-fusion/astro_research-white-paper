# yaml-language-server: $schema=../../schema.json
# Moon in a Indra-mandala nakshatra: earthquake study indicator as a rule file.
id: seismic.study.moon_mandala_indra
version: 2
name: Earthquake Moon in a Indra-mandala nakshatra
domain: seismic
claim: 'Moon in a Indra-mandala nakshatra: the rate of declustered Himalayan-arc earthquakes differs from
  the rate outside it.'
source:
  text: Varahamihira, Brihat Samhita
  chapter: "32"
  verse: "16-19"
  edition: "M. Ramakrishna Bhat tr., Motilal Banarsidass, 1981, Part 1"
  translator: "M. Ramakrishna Bhat"
  page: "301"
  quote: "The seven asterisms, Abhijit, Sravana, Dhanistha, Rohini, Jyestha, Uttarasadha, and Anuradha, constitute Indra's Circle."
  published: '550'
  note: Bhukampa-lakshana. The text uses the mandala to read the consequences of a quake. The nakshatra
    membership is not yet checked against a translation (plan indicator_notes).
author: astro-research study plan (ported 2026-11-22)
tier: experimental
status: active
conditions:
  # Indra circle, Brihat Samhita 32.16 (Bhat tr. p. 301): Abhijit, Shravana, Dhanishtha, Rohini, Jyeshtha,
  # Uttara Ashadha, Anuradha. Written as the Moon's sidereal longitude ranges so the Abhijit choice is a
  # declared parameter (REVIEW_1 fix 6; operationalisation choice "abhijit"). The primary values are the
  # boundaries of the 27 equal nakshatras: the same calendar as moon_mandala {mandalas: [indra]}
  # (tests/test_validity_controls_baselines.py checks this bar for bar).
  any:
  - longitude_between: {planet: Moon, start: $rohini_start, end: $rohini_end}
  - longitude_between: {planet: Moon, start: $anuradha_start, end: $jyeshtha_end}
  - longitude_between: {planet: Moon, start: $uttarashadha_start, end: $dhanishta_end}
expected_effect:
  event: earthquake
  direction: either
  fixed_by: project
params:
  # 27 equal nakshatras of 13 deg 20 min: Rohini (4th), Anuradha and Jyeshtha (17th, 18th), Uttara Ashadha
  # to Dhanishtha (21st to 23rd). Abhijit's classical span lies inside the third range.
  rohini_start: {value: 40.0, min: 38.0, max: 41.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
  rohini_end: {value: 53.333333333333336, min: 51.0, max: 54.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
  anuradha_start: {value: 213.33333333333334, min: 205.0, max: 214.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
  jyeshtha_end: {value: 240.0, min: 231.0, max: 241.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
  uttarashadha_start: {value: 266.6666666666667, min: 257.0, max: 267.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
  dhanishta_end: {value: 306.6666666666667, min: 306.0, max: 309.0, step: 0.5, unit: deg, range_source: "author's choice: 27 or 28 equal divisions of the sidereal zodiac (BS 32.16 names the members, not their spans)"}
variants:
- id: abhijit_28_equal
  role: sensitivity
  # 28 equal asterisms of 12 deg 51 min 26 s with Abhijit the 22nd: Rohini 4th, Anuradha and Jyeshtha 17th
  # and 18th, Uttara Ashadha, Abhijit, Shravana, Dhanishtha 21st to 24th (7 of 28 asterisms).
  params:
    rohini_start: 38.57142857142857
    rohini_end: 51.42857142857143
    anuradha_start: 205.71428571428572
    jyeshtha_end: 231.42857142857142
    uttarashadha_start: 257.14285714285717
    dhanishta_end: 308.57142857142856
reference_cases:
- moment: '2001-07-30T06:00:00Z'
  expect: fires
  note: Moon in a Indra-mandala nakshatra holds at this moment (06:00 UTC, 4-day scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
- moment: '2001-09-16T06:00:00Z'
  expect: silent
  note: Moon in a Indra-mandala nakshatra does not hold at this moment (06:00 UTC, 4-day scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
reading:
  kind: concurrent
  text_says: post_event_classification
  note: Brihat Samhita ch. 32 reads the mandala after an earthquake to judge its results. We test whether
    the event rate differs by mandala. The text does not claim this.
operationalisation:
- choice: day_convention
  value: hourly UTC grid step containing the event, no day boundary
  fixed_by: project
  alternatives:
  - daily at 12:00 UTC
  - sunrise day at the arc centre
- choice: place
  value: 'none: geocentric sidereal positions'
  fixed_by: project
  alternatives:
  - arc centre 28 N 85 E
- choice: horizon
  value: the same grid step as the event
  fixed_by: project
  alternatives:
  - 24 hours
- choice: abhijit
  value: >-
    included with its classical span, 276 deg 40 min to 280 deg 53 min 20 s sidereal (the last quarter of
    Uttara Ashadha and the first fifteenth of Shravana). Both of those nakshatras are Indra members, so on the
    27 equal nakshatras including Abhijit changes no bar: the primary calendar is the 27-nakshatra Indra circle
  fixed_by: project
  alternatives:
  - 28 equal asterisms with Abhijit the 22nd (sensitivity variant abhijit_28_equal)
  - Abhijit dropped (the same calendar as the primary on 27 nakshatras)
  note: Bhat's list (BS 32.16) names Abhijit; engine versions before 2 dropped it without saying so (REVIEW_1 fix 6).
- choice: ayanamsa
  value: Lahiri
  fixed_by: project
  alternatives:
  - Raman
  - Krishnamurti
tests:
- domain: earthquake
  outcome: mainshock_rate
  direction: either
  project_extension: true
  note: The text claims nothing about the event rate by mandala.
notes:
  ported_from: Moved unchanged from studies/earthquake/hypothesis.yaml (ADR-007 WP-71); the plan's indicator
    id is moon_mandala_indra.
  plan_indicator: moon_mandala_indra
