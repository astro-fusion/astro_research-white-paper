# yaml-language-server: $schema=../../schema.json
# Moon in a Vayu-mandala nakshatra: earthquake study indicator as a rule file.
id: seismic.study.moon_mandala_vayu
version: 1
name: Earthquake Moon in a Vayu-mandala nakshatra
domain: seismic
claim: 'Moon in a Vayu-mandala nakshatra: the rate of declustered Himalayan-arc earthquakes differs from
  the rate outside it.'
source:
  text: Varahamihira, Brihat Samhita
  chapter: "32"
  verse: "8-11"
  edition: "M. Ramakrishna Bhat tr., Motilal Banarsidass, 1981, Part 1"
  translator: "M. Ramakrishna Bhat"
  page: "299"
  quote: "The stellar circle or group presided over by the Wind-God consists of the seven constellations viz. Uttaraphalguni, Hasta, Citra, Svati, Punarvasu, Mrgasirsa and Asvini"
  published: '550'
  note: Bhukampa-lakshana. The text uses the mandala to read the consequences of a quake. The nakshatra
    membership is not yet checked against a translation (plan indicator_notes).
author: astro-research study plan (ported 2026-11-22)
tier: experimental
status: active
conditions:
  moon_mandala:
    mandalas:
    - vayu
expected_effect:
  event: earthquake
  direction: either
  fixed_by: project
reference_cases:
- moment: '2001-08-15T06:00:00Z'
  expect: fires
  note: Moon in a Vayu-mandala nakshatra holds at this moment (06:00 UTC, 4-day scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
- moment: '2001-09-08T06:00:00Z'
  expect: silent
  note: Moon in a Vayu-mandala nakshatra does not hold at this moment (06:00 UTC, 4-day scan 1990-2024)
  verified_with: astro-research engine 2026-11-22 (Lahiri, mean node); not yet checked in JHora
reading:
  kind: concurrent
  text_says: post_event_classification
  note: Brihat Samhita ch. 32 reads the mandala after an earthquake to judge its results. We test whether
    the event rate differs by mandala. The text does not claim this.
operationalisation:
- choice: day_convention
  value: hourly UTC grid step containing the event, no day boundary
  fixed_by: project
  alternatives:
  - daily at 12:00 UTC
  - sunrise day at the arc centre
- choice: place
  value: 'none: geocentric sidereal positions'
  fixed_by: project
  alternatives:
  - arc centre 28 N 85 E
- choice: horizon
  value: the same grid step as the event
  fixed_by: project
  alternatives:
  - 24 hours
- choice: ayanamsa
  value: Lahiri
  fixed_by: project
  alternatives:
  - Raman
  - Krishnamurti
tests:
- domain: earthquake
  outcome: mainshock_rate
  direction: either
  project_extension: true
  note: The text claims nothing about the event rate by mandala.
  project_extension: false
notes:
  ported_from: Moved unchanged from studies/earthquake/hypothesis.yaml (ADR-007 WP-71); the plan's indicator
    id is moon_mandala_vayu.
  plan_indicator: moon_mandala_vayu
