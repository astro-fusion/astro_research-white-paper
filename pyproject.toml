[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-astrology-core"
version = "0.1.0"
description = "Vedic Astrology Core Library with Swiss Ephemeris Integration"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Bishal Ghimire", email = "bishal.ghimire@gmail.com"},
]
maintainers = [
    {name = "Bishal Ghimire", email = "bishal.ghimire@gmail.com"},
]
keywords = [
    "numerology",
    "astrology",
    "vedic",
    "sidereal",
    "swiss-ephemeris",
    "pyswisseph",
    "lahiri-ayanamsa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Religion",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0,<3",
    "pandas>=1.3.0,<4",
    "scipy>=1.7.0,<2",
    "matplotlib>=3.4.0,<4",
    "seaborn>=0.11.0,<1",
    "pytz>=2021.1",
    "PyYAML>=6.0,<7",
    "suntime>=1.2.5,<2",
    "requests>=2.25.0,<3",
    "statsmodels>=0.13.0,<1",
    "astropy>=5.0.0,<9",
    "tqdm>=4.60.0,<5",
    "pyswisseph>=2.10,<3",
]

[project.scripts]
vedic-numerology = "vedic_astrology_core.cli:main"

[project.optional-dependencies]
# Live market-data download (never needed for CI or `make build`).
fetch = [
    "yfinance>=0.2.30,<2",
]
# LLM diagram generator in libs/visuals (unrelated to data plotting).
diagrams = [
    "google-generativeai>=0.3.0,<1",
    "paperbanana>=0.1.0,<1",
]
# Quarto Jupyter kernels used to render the papers.
docs = [
    "jupyter>=1.0.0,<2",
    "nbformat>=5.0.0,<6",
    "nbclient>=0.5.0,<1",
    "jupyter-cache>=0.6.0,<2",
    "sphinx>=5.0.0,<9",
    "sphinx-rtd-theme>=1.0.0,<4",
]
dev = [
    "pytest>=7.0.0,<10",
    "pytest-cov>=4.0.0,<8",
    "flake8>=6.0.0,<8",
    "flake8-docstrings>=1.7.0,<2",
    "black>=22.0.0,<27",
    "isort>=5.10.0,<8",
    "mypy>=1.0.0,<2",
]
colab = [
    "plotly>=5.0.0,<7",
    "ipywidgets>=7.6.0,<9",
]
api = [
    "fastapi>=0.104.0,<1",
    "uvicorn[standard]>=0.24.0,<1",
    "pydantic>=2.0.0,<3",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0,<1",
    "gunicorn>=21.2.0",
]
app = [
    "streamlit>=1.28.0,<2",
    "plotly>=5.17.0,<7",
]
# Kept for backwards compatibility: pyswisseph is now a core dependency.
ephemeris = []
all = [
    "vedic-astrology-core[dev,docs,fetch,diagrams,colab,api,app]",
]

[project.urls]
Homepage = "https://github.com/astro-fusion/astro_research-white-paper"
Documentation = "https://astro-research-white-paper.readthedocs.io/"
Repository = "https://github.com/astro-fusion/astro_research-white-paper"
"Bug Reports" = "https://github.com/astro-fusion/astro_research-white-paper/issues"
"Source" = "https://github.com/astro-fusion/astro_research-white-paper"

[tool.setuptools]
package-dir = {"" = "libs"}

[tool.setuptools.packages.find]
where = ["libs"]
include = ["vedic_astrology_core*", "vedic_numerology*"]

[tool.setuptools.package-data]
vedic_astrology_core = ["config/*.yaml"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disable_error_code = ["attr-defined", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "swisseph.*",
    "flatlib.*",
    "matplotlib.*",
    "numpy",
    "pandas",
    "seaborn",
    "plotly.*",
    "yaml",
    "pytz",
    "dateutil",
    "vedic_numerology.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=vedic_astrology_core --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "reference: marks tests that validate against reference cases",
]
